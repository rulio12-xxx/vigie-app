<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13202C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Vigie Patrimoine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: carnet d'ordres — bandeau de signaux, filtres par enveloppe, puis lignes triées par urgence */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E3E8EE; --ink:#13202C; --muted:#5A6878; --line:#D3DAE2;
  --accent:#28468F; --accent-soft:#E2E8F6;
  --buy:#B0291F; --buy-soft:#F8E0DD; --thumb:#3DBE78; --sell:#14774A; --sell-soft:#DDF1E6; --up:#14774A; --up-soft:#DDF1E6; --down:#B0291F;
  --warn:#9A5B00; --warn-soft:#F6EAD3; --drop:#7A3FD9; --hig:#0E7490; --gone:#6B5A7E; --gone-soft:#ECE6F2;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#161E27; --sunk:#1E2833; --ink:#E4EAF0; --muted:#93A1B0; --line:#2A3542;
  --accent:#8EA8EC; --accent-soft:#1F2B47;
  --buy:#F08A80; --buy-soft:#3A1A17; --thumb:#8FE3B5; --sell:#5FCB93; --sell-soft:#14301F; --up:#5FCB93; --up-soft:#14301F; --down:#F08A80;
  --warn:#E7B45C; --warn-soft:#352812; --drop:#B48CFF; --hig:#4FC3D9; --gone:#B9A6D2; --gone-soft:#2A2235; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#161E27; --sunk:#1E2833; --ink:#E4EAF0; --muted:#93A1B0; --line:#2A3542;
  --accent:#8EA8EC; --accent-soft:#1F2B47;
  --buy:#F08A80; --buy-soft:#3A1A17; --thumb:#8FE3B5; --sell:#5FCB93; --sell-soft:#14301F; --up:#5FCB93; --up-soft:#14301F; --down:#F08A80;
  --warn:#E7B45C; --warn-soft:#352812; --drop:#B48CFF; --hig:#4FC3D9; --gone:#B9A6D2; --gone-soft:#2A2235; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding:0 16px;padding-block:12px 84px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font:800 24px/1 var(--f-display);font-stretch:78%;letter-spacing:.01em;margin:0;text-transform:uppercase}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.total{text-align:right}
.total .v{font:500 18px var(--f-num)}
.total .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}
/* signaux */
.signals{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sig{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:2px}
.sig .n{font:600 20px/1 var(--f-num)}
.sig .t{font-size:11px;line-height:1.2;color:var(--muted)}
.sig[data-k="buy"] .n{color:var(--buy)} .sig[data-k="sell"] .n{color:var(--sell)}
.sig[data-k="buy"][aria-pressed="true"]{border-color:var(--buy);box-shadow:inset 0 0 0 1px var(--buy);background:var(--buy-soft)}
.sig[data-k="sell"][aria-pressed="true"]{border-color:var(--sell);box-shadow:inset 0 0 0 1px var(--sell);background:var(--sell-soft)}
.sig[data-k="drop"] .n{color:var(--drop)} .sig[data-k="soonbuy"] .n{color:var(--buy);opacity:.75} .sig[data-k="soonsell"] .n{color:var(--sell);opacity:.75} .sig[data-k="expired"] .n{color:var(--gone)}
.sig[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
@media (max-width:560px){.signals{grid-template-columns:repeat(3,1fr)}}
/* enveloppes */
.envs{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 10px;font:500 13px var(--f-body);cursor:pointer;display:flex;gap:8px;align-items:baseline}
.chip .num{font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .num{color:inherit;opacity:.75}
.chip.reset{border-style:dashed;color:var(--accent);border-color:var(--accent)}
/* lignes */
.list{display:flex;flex-direction:column;gap:6px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px 6px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;position:relative;overflow:hidden}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--stripe,transparent)}
.row:focus-visible,.chip:focus-visible,.sig:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.name{font:700 16px/1.15 var(--f-display);font-stretch:85%;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.env{font:600 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:4px}
.code{font:400 11px var(--f-num);color:var(--muted)}
.sold{display:inline-block;min-width:16px;padding:0 4px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font:700 12px/16px var(--f-body);text-align:center}
.hq.memo{color:var(--ink);font-style:italic}
.stars{font:400 13px/1 var(--f-body);letter-spacing:1px;color:var(--warn);white-space:nowrap}
.stars .off{color:var(--line)}
.med{display:inline-flex;align-items:center;gap:3px;font:600 11px var(--f-num);padding:1px 7px 1px 3px;border-radius:999px;white-space:nowrap;color:var(--mc);background:color-mix(in srgb,var(--mc) 15%,transparent)}
.med svg{width:14px;height:14px;flex:none}
.med.m-or{--mc:#B8901A}.med.m-argent{--mc:#7D8794}.med.m-bronze{--mc:#A8662E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .med.m-or{--mc:#E3B93C}:root:not([data-theme="light"]) .med.m-argent{--mc:#B9C2CC}:root:not([data-theme="light"]) .med.m-bronze{--mc:#D08A4E}}
:root[data-theme="dark"] .med.m-or{--mc:#E3B93C}:root[data-theme="dark"] .med.m-argent{--mc:#B9C2CC}:root[data-theme="dark"] .med.m-bronze{--mc:#D08A4E}
.conc{display:inline-flex;align-items:center;gap:3px;font:600 10px var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:1px 6px 1px 4px;border-radius:999px;white-space:nowrap}
.conc svg{width:12px;height:12px;flex:none}
.spk{display:inline-flex;align-items:center;gap:3px;font:600 10px var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:1px 6px 1px 4px;border-radius:999px;white-space:nowrap;color:var(--warn);background:var(--warn-soft);margin-left:4px;vertical-align:middle}
.spk svg{width:12px;height:12px;flex:none}
.bx{--bxbg:#efe7ff;--bxfg:#5b21b6;--bxbd:#c4b2f7;display:inline-flex;align-items:center;gap:5px;font:700 12px var(--f-body);letter-spacing:.02em;padding:2px 9px;border-radius:999px;white-space:nowrap;margin-left:6px;vertical-align:middle;color:var(--bxfg);background:var(--bxbg);border:1.5px solid var(--bxbd)}
.bx.b3,.bx.b4{--bxbg:#e2d3ff;--bxbd:#8b5cf6}.bx.b4{--bxbg:#6d28d9;--bxfg:#fff;--bxbd:#6d28d9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bx{--bxbg:#34265a;--bxfg:#ddd0ff;--bxbd:#6b52b8}:root:not([data-theme="light"]) .bx.b3{--bxbg:#4a3485;--bxbd:#9b7bf0}:root:not([data-theme="light"]) .bx.b4{--bxbg:#8b5cf6;--bxfg:#fff;--bxbd:#8b5cf6}}
:root[data-theme="dark"] .bx{--bxbg:#34265a;--bxfg:#ddd0ff;--bxbd:#6b52b8}:root[data-theme="dark"] .bx.b3{--bxbg:#4a3485;--bxbd:#9b7bf0}:root[data-theme="dark"] .bx.b4{--bxbg:#8b5cf6;--bxfg:#fff;--bxbd:#8b5cf6}
.dcr{display:inline-flex;align-items:center;gap:4px;font:700 12px var(--f-body);padding:2px 9px;border-radius:999px;white-space:nowrap;margin-left:6px;vertical-align:middle;color:#fff;background:#c2410c;border:1.5px solid #c2410c}
.dcr svg{width:13px;height:13px;flex:none}
.dcr.conf{background:#b91c1c;border-color:#7f1d1d}
.bx .g{display:inline-flex;gap:2px}.bx .g i{width:5px;height:12px;border-radius:1px;background:currentColor;opacity:.25}.bx .g i.on{opacity:1}
.conc.c-eleve{color:var(--down);background:var(--sell-soft);background:color-mix(in srgb,var(--down) 14%,transparent)}
.conc.c-moyen{color:var(--warn);background:var(--warn-soft)}
.hq{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
.hq .perhi{color:var(--down);font-weight:700}
.hqw{grid-column:1/-1;min-width:0;font-size:11px;line-height:.9;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;line-clamp:5;overflow:hidden}
.hqw .hq{display:inline;margin:0}.hqw .hq+.hq::before{content:" · "}
.hq .y{color:var(--up)} .hq .x{color:var(--muted);opacity:.7}
.price{text-align:right}
.price .c{font:500 15px/1.2 var(--f-num);display:inline-flex;align-items:center;gap:6px}
.live{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;color:var(--accent);background:var(--accent-soft);text-decoration:none;flex:none}
.live:hover{filter:brightness(.92)}.live svg{width:13px;height:13px}
.price .d{font-size:11px;color:var(--muted)}
.price .d.stale{color:var(--warn)}
.price .d .old{font:600 9px var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:0 4px;border-radius:3px}
.price .d.est{color:var(--accent);font-style:italic}
.pl{font:500 12px var(--f-num)}
.pos{color:var(--up)} .neg{color:var(--down)}
.rules{grid-column:1/-1;display:flex;flex-direction:column;gap:2px}
.rule{display:flex;align-items:baseline;gap:6px;font-size:12px;line-height:1.35}
.rule .txt{min-width:0}
.pill{font:600 10px var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;flex:none;border-radius:999px;white-space:nowrap}
.p-buy{background:var(--buy-soft);color:var(--buy)} .p-sell{background:var(--sell-soft);color:var(--sell)}
.p-warn{background:var(--warn-soft);color:var(--warn)} .p-gone{background:var(--gone-soft);color:var(--gone)}
.p-ok{background:var(--sunk);color:var(--muted)}
.rule .txt{color:var(--muted)} .rule .txt b{color:var(--ink);font-weight:500}
.bar{grid-column:1/-1;position:relative;height:38px}
.bar.two{height:50px}
.bar .track{position:absolute;left:0;right:0;top:16px;height:4px;border-radius:2px;background:var(--sunk)}
.bar .zone{position:absolute;top:16px;height:4px}
.bar .tick{position:absolute;top:11px;width:2px;height:14px;border-radius:1px;transform:translateX(-1px)}
.bar .tl{position:absolute;font:500 10px var(--f-num);letter-spacing:-.2px;transform:translateX(-50%);white-space:nowrap}
.bar .tl.r0{top:25px} .bar .tl.r1{top:37px}
.bar .ok{position:absolute;top:-4px;width:22px;height:22px;z-index:1;transform:translateX(-50%);color:var(--thumb);background:var(--up-soft);border-radius:50%;padding:3px;pointer-events:none}
.okin{font-size:12px;filter:hue-rotate(0deg)}
.bar .ok svg{display:block;width:16px;height:16px}
.bar .now{position:absolute;top:13.5px;width:9px;height:9px;border-radius:50%;background:var(--ink);transform:translateX(-4.5px)}
.bar .nl{position:absolute;top:-1px;font:600 10px var(--f-num);color:var(--ink);transform:translateX(-50%);white-space:nowrap}
.readme{margin:28px 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 16px}
.readme summary{cursor:pointer;padding:14px 0;font-weight:600}
.readme .rd{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.readme .md{font-size:13px;line-height:1.5;padding-bottom:16px;overflow-x:auto;min-width:0}
.readme .md h1{font-size:18px}.readme .md h2{font-size:16px;margin-top:22px}.readme .md h3{font-size:14px}
.readme .md table{border-collapse:collapse;font-size:12px;margin:8px 0;display:block;overflow-x:auto}
.readme .md th,.readme .md td{border:1px solid var(--line);padding:3px 6px;text-align:left}
.readme .md code{background:var(--sunk);border-radius:4px;padding:0 3px;font-size:12px}
.readme .md pre{background:var(--sunk);padding:8px;border-radius:8px;overflow-x:auto}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--surface);border:0;border-radius:999px;padding:14px 20px;font:600 15px var(--f-body);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18)}
/* feuille d'édition */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h2{font:800 22px var(--f-display);font-stretch:80%;text-transform:uppercase;margin:0}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
legend{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 4px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.full{grid-column:1/-1}
input,select,textarea{font:15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-num)}
.hint{grid-column:1/-1;font-size:12px;color:var(--muted);margin:0}
.ana{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px}
.ana summary{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;padding:2px 0}
.ana .tw{overflow-x:auto;margin:8px 0 4px}
.ana table{border-collapse:collapse;font:400 12px var(--f-num);width:100%;min-width:320px}
.ana th,.ana td{padding:3px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.ana th:first-child,.ana td:first-child{text-align:left;color:var(--muted);font-family:var(--f-body)}
.ana thead th{color:var(--muted);font-weight:600}
.ana .e{font-style:italic;color:var(--accent)}
.ana p{margin:6px 0 0;line-height:1.45}
.ana .k{color:var(--muted)}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.synth{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;overflow-x:auto}
.synth table{border-collapse:collapse;width:100%;font:400 13px var(--f-num)}
.synth th,.synth td{padding:4px 6px;text-align:right;white-space:nowrap}
.synth th{font:600 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.synth td:first-child,.synth th:first-child{text-align:left;font-family:var(--f-body);font-weight:600}
.synth tr.tot td{border-top:1px solid var(--line);font-weight:600}
.synth tr.cash td{color:var(--muted);font-style:italic}
.synth .nc{color:var(--muted);font-size:11px;font-family:var(--f-body)}
.jour{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:8px 12px;font-size:13px}
.jour summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;list-style:none}
.jour summary::-webkit-details-marker{display:none}
.jour .jt{font:700 15px/1.2 var(--f-display);font-stretch:85%;text-transform:uppercase;letter-spacing:.02em;color:var(--accent)}
.jour .jh{font-size:13px;color:var(--ink);font-weight:500}
.jour .jd{font:400 11px var(--f-num);color:var(--muted);margin-left:auto}
.jour h3{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 3px}
.jour ul{margin:0;padding-left:18px;line-height:1.45}
.jour li{margin:2px 0}
.jour .src{font-size:11px;color:var(--muted);margin-top:8px}
.jour .src a{color:var(--accent)}
.jour .rk{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-body);padding:2px 8px;border-radius:999px;white-space:nowrap}
.jour .rk.r0{color:var(--up);background:var(--up-soft)} .jour .rk.r1{color:var(--warn);background:var(--warn-soft)} .jour .rk.r2{color:var(--down);background:var(--buy-soft)}
.jour .rk .g{display:inline-flex;gap:2px}.jour .rk .g i{width:5px;height:10px;border-radius:1px;background:currentColor;opacity:.25}.jour .rk .g i.on{opacity:1}
.spec{margin-top:8px}.spec .sw{overflow-x:auto}
.spec table.st{border-collapse:collapse;font-size:12px;width:100%;min-width:560px}
.spec table.st th{font:600 10px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.spec table.st th:first-child,.spec table.st td:first-child{text-align:left}
.spec table.st td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-num);white-space:nowrap}
.spec table.st td:first-child{font-family:var(--f-body);font-weight:600}
.spec .in{font:500 10px var(--f-body);color:var(--accent);margin-left:4px}
.spec .pp{display:inline-flex;gap:2px;vertical-align:middle;margin-left:4px}.spec .pp i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.2}.spec .pp i.on{opacity:1}
.spec .nb{color:var(--down)}.spec .nr{color:var(--up)}
.jour table.rt{border-collapse:collapse;font-size:12px;margin-top:2px}
.jour table.rt td{padding:2px 8px 2px 0;vertical-align:top}
.jour table.rt td.p{font:600 12px var(--f-num);text-align:right;white-space:nowrap}
.jour .old{font:600 9px var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:0 4px;border-radius:3px}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:10px 16px;font:600 14px var(--f-body);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--sell);border-color:var(--sell)}
.err{color:var(--sell);font-size:13px}
@media (prefers-reduced-motion:no-preference){.row{transition:border-color .15s}.row:hover{border-color:var(--muted)}}

.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
.loginbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:420px;width:100%;display:grid;gap:10px}
.loginbox h2{margin:0}.loginbox p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.loginbox label{display:grid;gap:4px;font-size:13px}.loginbox input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.loginbox button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--ink);color:var(--surface);cursor:pointer}
.loginbox .err{color:var(--down);font-size:13px}

<body>


<div class="wrap">
  <header>
    <div>
      <h1>Vigie Patrimoine</h1>
      <div class="sub" id="today"></div><button type="button" class="btnRelever" id="btnReleverHaut" onclick="vigieRelever()" title="Lance le robot (2-3 min, sans IA)">↻ Rafraîchir les cours</button>
    </div>
    <div class="total"><div class="l">Valorisation suivie</div><div class="v" id="total">—</div><div class="pl" id="totalpl"></div><div class="pl" id="perm"></div></div>
  </header>
  <div class="banner" id="banner" hidden></div>

<div id="sheetHost"></div>

<script src="stockage.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const ENVS=["PEA","PEA-PME","Assurance vie","PER","PEE","CTO"];
const SOON_DAYS=15, NEAR_PCT=0.02, STALE_DAYS=7;
const OLD_HOURS=24; // badge « différé » : cotation de plus de 24 h (rien en dessous)
const ageH=l=>{if(!l.coursDate)return 0;const t=new Date(l.coursDate+"T"+(/^\d\d:\d\d$/.test(l.coursHeure||"")?l.coursHeure:"17:35"));return (Date.now()-t)/36e5;};
const TYPES=["Actions","ETF","Fonds"];
const isAct=l=>(!l.type||l.type==="Actions")&&l.env!=="PEE"&&l.env!=="Assurance vie"&&!String(l.higgons?.grille||"").startsWith("Fonds")&&!l.fonds;
const envTot=e=>{if(n(especes?.[e])==null)return 0;let t=0;lines.forEach(x=>{if(x.env===e&&Q(x)>0&&n(x.cours))t+=Q(x)*x.cours;});return t?t+(n(especes?.[e])||0):0;};
const typeOf=l=>l.type||((l.vl||l.env==="PEE"||l.env==="Assurance vie")?"Fonds":l.higgons?"Actions":"ETF");
let especes=null, spec=null, specOpen=false, jour=null, lines=[], filterEnv=null, filterSig=null, filterDiv=null, filterBx=false, filterMine=false, filterStar=null, filterType="Actions", db=null, coll=null, editing=null;

const $=s=>document.querySelector(s);
const eur1=v=>eur(v,1);
const eur=(v,d=2)=>v==null||isNaN(v)?"—":v.toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d})+" €";
const pct=v=>(v>0?"+":"")+(v*100).toLocaleString("fr-FR",{minimumFractionDigits:1,maximumFractionDigits:1})+" %";
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const TODAY=iso(new Date());
const days=(a,b)=>Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);
const fdate=s=>s?new Date(s+"T12:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"2-digit"}):"";
const n=v=>(v===""||v==null||isNaN(+v))?null:+v;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- moteur de règles : prix cible + date limite ---- */
function evaluate(l){
  const c=n(l.cours), out=[]; let rank=4;
  const a=l.achat||{}, v=l.vente||{};
  const hasRule=n(a.prix)!=null||n(v.objectif)!=null||n(v.stop)!=null;
  const dA=n(a.prixDerive)!=null?` <span title="${esc(a.baseDerive||"")}">(😈 abaissé de ${eur1(+a.prix)})</span>`:"", dV=n(v.objectifDerive)!=null?` <span title="${esc(v.baseDerive||"")}">(😈 abaissée de ${eur(+v.objectif)})</span>`:"";
  if(c==null||!hasRule){return {rank:5,rules:[{cls:"p-ok",tag:"À configurer",txt:c==null?"Saisis le cours actuel":"Ajoute un seuil d'achat ou de vente",k:null}]};}
  const left=d=>d?days(TODAY,d):null;
  if(l.vendu&&n(l.rachat?.prix)!=null){
    // ligne vendue : rachat (règle du 30/10/2026) = le plus bas de (vente − 15 %, seuil d'achat), note ≥ 3★, pas de 😈, cours qui remonte
    const p=+l.rachat.prix, nt=n(l.higgons?.note), ok=nt!=null&&nt>=3&&!l.derive?.motifs?.length, up=a.limite?.date===TODAY&&(a.limite.tendance==="remonte"||a.limite.rebond);
    const t=`Rachat ≤ <b>${eur(p)}</b> · ${esc(l.rachat.base||"")}${!ok?` · bloqué : ${nt==null?"pas de note":nt<3?`note ${nt}★ (< 3★)`:"😈"}`:""}`;
    if(c<=p&&ok&&up) out.push({cls:"p-buy",tag:"Racheter",k:"buy",rk:0,txt:t+limTxt(a)});
    else if(c<=p&&ok) out.push({cls:"p-warn",tag:"Attendre le rebond",k:"soonbuy",rk:2,txt:t});
    else out.push({cls:"p-ok",tag:"Rachat en veille",k:null,rk:3,txt:t+` · encore ${pct((p-c)/c).replace("-","−")}`});
  }
  else if(n(a.prix)!=null){
    const p=+(n(a.prixDerive)??a.prix), dl=left(a.avant), dist=(c-p)/c;
    let r;
    if(n(l.pru)!=null) r={cls:"p-ok",tag:"Achat fait",k:null,rk:3,txt:`Seuil d'achat <b>${eur1(p)}</b> · arbitrage déjà fait (PRU ${eur(+l.pru)})`};
    else if(dl!=null&&dl<0) r={cls:"p-gone",tag:"Délai dépassé",k:"expired",rk:1,txt:`Achat ≤ <b>${eur1(p)}</b> prévu avant le ${fdate(a.avant)} — à réévaluer`};
    else if(c<=p&&isAct(l)&&!(n(l.higgons?.note)>2)&&!(a.limite?.date===TODAY&&(a.limite.tendance==="remonte"||a.limite.rebond))) r={cls:"p-warn",tag:"Attendre le rebond",k:"soonbuy",rk:2,txt:`Cours sous le seuil de <b>${eur1(p)}</b>, mais valeur ${n(l.higgons?.note)??"?"}★ encore en baisse : achat seulement quand le cours remonte (règle des paris)${limTxt(a)}`};
    else if(c<=p) r={cls:"p-buy",tag:"Acheter",k:"buy",rk:0,txt:`Cours sous le seuil de <b>${eur1(p)}</b>${dl!=null?` · reste ${dl} j`:""}${limTxt(a)}`};
    else{
      const soon=dl!=null&&dl<=SOON_DAYS, near=(c-p)/p<NEAR_PCT; // écart mesuré par rapport au seuil, comme la routine
      r={cls:soon||near?"p-warn":"p-ok",tag:soon?"Échéance proche":near?"Seuil proche":"Achat en veille",k:soon||near?"soonbuy":null,rk:soon||near?2:3,
         txt:`Achat ≤ <b>${eur1(p)}</b> · encore ${pct(-dist).replace("-","−")}${dl!=null?` · ${dl} j restants (${fdate(a.avant)})`:""}${near?limTxt(a):""}`};
    }
    if(dA&&n(l.pru)==null)r.txt+=dA;
    out.push(r);
  }
  if(n(v.objectif)!=null||n(v.stop)!=null){
    const o=n(v.objectifDerive)??n(v.objectif), s=n(v.stop), dl=left(v.avant);
    let r;
    // ligne non détenue : la cible de revente est une information, jamais un signal de vente
    if(!(Q(l)>0)) r={cls:"p-ok",tag:"Revente visée",k:null,rk:3,txt:`${o!=null?`Cible <b>${eur(o)}</b> une fois achetée (${pct((o-c)/c)} vs cours)`:"Pas de cible"}${s!=null?` · stop ${eur(s)}`:""}`};
    else if(s!=null&&c<=s) r={cls:"p-sell",tag:"Stop atteint",k:"sell",rk:0,txt:`Cours sous le stop de <b>${eur(s)}</b> — vendre`};
    else if(o!=null&&c>=o) r={cls:"p-sell",tag:"Vendre",k:"sell",rk:0,txt:`Cible de <b>${eur(o)}</b> atteinte${n(l.pru)?` · ${pct((c-l.pru)/l.pru)} vs PRU`:""}`};
    else if(dl!=null&&dl<0) r={cls:"p-gone",tag:"Délai dépassé",k:"expired",rk:1,txt:`Cible ${o!=null?`<b>${eur(o)}</b> `:""}non atteinte au ${fdate(v.avant)} — vendre ou prolonger ?`};
    else{
      const dist=o!=null?(o-c)/c:null, soon=dl!=null&&dl<=SOON_DAYS, nearO=o!=null&&(o-c)/o<NEAR_PCT, nearS=s!=null&&(c-s)/s<NEAR_PCT, near=nearO||nearS;
      const stopTxt=s!=null?` · stop ${eur(s)}`:"";
      r={cls:soon||near?"p-warn":"p-ok",tag:soon?"Échéance proche":nearS?"Stop proche":nearO?"Cible proche":"Vente en veille",k:soon||near?"soonsell":null,rk:soon||near?2:3,
         txt:`${o!=null?`Cible <b>${eur(o)}</b> · encore ${pct(dist)}`:"Pas de cible"}${stopTxt}${dl!=null?` · ${dl} j restants`:""}`};
    }
    if(dV&&o!=null)r.txt+=dV;
    out.push(r);
  }
  // horizon de revente (règle du 30/10/2026) : court terme = moitié à +20 %, reste à +30 %, après 6 mois tout vendre dès +3 % (pas de stop en perte) ; long terme = 1/3 à la cible, note dégradée
  const hz=l.horizon?.type, pr=n(l.pru);
  if(Q(l)>0&&pr&&hz==="court"&&isAct(l)){
    const g=c/pr-1, ech=l.horizon.date?days(TODAY,new Date(Date.parse(l.horizon.date)+182*864e5).toISOString().slice(0,10)):null;
    const nt3=n(l.higgons?.note), oc=n(v.objectifDerive)??n(v.objectif), ob=(nt3!=null&&nt3>=3&&oc&&oc>pr*1.3)?oc:pr*1.3;
    const base=`Court terme : ½ à <b>${eur(pr*1.2)}</b> (+20 %) · reste à <b>${eur(ob)}</b> (${ob>pr*1.3?`cible ${nt3}★, `:""}${pct(ob/pr-1)}) · après 6 mois, tout vendre dès <b>${eur(pr*1.03)}</b> (+3 %)${ech!=null?` · ${ech>0?`dans ${ech} j`:"6 mois atteints"}`:""} · gain ${pct(g)}`;
    let r;
    if(c>=ob) r={cls:"p-sell",tag:"Vendre le reste",k:"sell",rk:0,txt:base};
    else if(g>=0.20) r={cls:"p-sell",tag:"Vendre la moitié",k:"sell",rk:0,txt:base};
    else if(ech!=null&&ech<=0&&g>=0.03) r={cls:"p-sell",tag:"Tout vendre (+3 %)",k:"sell",rk:0,txt:base};
    else if(ech!=null&&ech<=0) r={cls:"p-gone",tag:"6 mois : attendre +3 %",k:null,rk:2,txt:base};
    else{const near=g>=0.18;r={cls:near?"p-warn":"p-ok",tag:near?"Objectif proche":"Court terme",k:near?"soonsell":null,rk:near?2:3,txt:base};}
    out.push(r);
    if(g<=-0.30) out.push({cls:"p-sell",tag:"Revoir la thèse",k:"sell",rk:0,txt:`Perte ${pct(g)} sur un pari : vérifier les nouvelles et la trésorerie avant de décider (pas de vente automatique)`});
    const te=envTot(l.env), vl=Q(l)*c;
    if(te&&(vl>0.05*te||l.horizon.allege)&&g>=0.08){const pal=g>=0.16?16:g>=0.12?12:8,k={8:1,12:2,16:3}[pal],q0=n(l.horizon.allege?.qte0)||Q(l),reste=Math.max(0,Q(l)-q0*(3-k)/3);
      out.push({cls:"p-sell",tag:`Alléger (${k}/3)`,k:"sell",rk:0,txt:`Pari trop gros à +${pal} % : vendre ${k===3?"tout le reste":`${Math.max(1,Math.round(reste))} action(s)`} · tranches de 1/3 à <b>${eur(pr*1.08)}</b>, <b>${eur(pr*1.12)}</b> et <b>${eur(pr*1.16)}</b>`});}
    if(te&&vl>0.05*te) out.push({cls:"p-warn",tag:"Pari trop gros",k:"soonsell",rk:2,txt:`${eur(vl,0)} soit ${(vl/te*100).toLocaleString("fr-FR",{maximumFractionDigits:1})} % du ${esc(l.env)} — plafond 5 % par ligne spéculative`});
  }
  if(Q(l)>0&&hz==="long"){
    out.forEach(r=>{if(r.tag==="Vendre"){r.tag="Vendre 1/3";r.txt+=" · long terme : vendre un tiers, laisser courir le reste";}});
    const nt=n(l.higgons?.note); if(nt!=null&&nt<=2&&isAct(l)) out.push({cls:"p-warn",tag:"Note dégradée",k:"soonsell",rk:2,txt:`Long terme mais note ${nt}★ : la thèse Higgons ne tient plus — vendre ou passer en court terme ?`});
  }
  rank=Math.min(...out.map(r=>r.rk));
  return {rank,rules:out};
}
/* ---- note Quality Value (Higgons) : 1 à 5 étoiles ---- */
/* ordre à cours limité conseillé (robot, règle du 22/10/2026), affiché seulement s'il date du jour */
const limTxt=a=>{const m=a?.limite;if(!m||n(m.prix)==null||m.date!==TODAY)return "";return ` · <span title="${esc(m.base||"")}">${m.rebond?"rebond après seuil : ":""}limite conseillée <b>${eur(+m.prix,2)}</b>${m.tendance?` (${esc(m.tendance)})`:""}</span>`;};
/* ligne détenue sous PRU − 10 % : renfort à cours limité conseillé (robot, règle du 22/10/2026) */
const renfTxt=l=>{const m=l.renfort;if(!m||n(m.prix)==null||m.date!==TODAY||!(n(l.cours)<=n(m.seuil)))return "";return `<div class="rule"><span class="pill p-buy" style="background:var(--drop);color:#fff">Renforcer ?</span><span class="txt" title="${esc(m.base||"")}">Cours sous PRU − 10 % (<b>${eur(+m.seuil,2)}</b>) · limite conseillée <b>${eur(+m.prix,2)}</b> (${esc(m.tendance||"")})</span></div>`;};
/* notes personnelles : le texte écrit entre guillemets dans le champ « note » est affiché dans la vignette */
function memo(l){const t=String(l.note||"");const m=[...t.matchAll(/"([^"\n]+)"|“([^”\n]+)”/g)].map(x=>(x[1]||x[2]).trim()).filter(Boolean);return m.length?`<div class="hq memo">💬 ${m.map(esc).join(" · ")}</div>`:"";}
function stars(l){
  const s=n(l.higgons?.note); if(s==null||s<1) return "";
  const k=Math.min(5,Math.round(s));
  return `<span class="stars" title="${/^Fonds/.test(l.higgons?.grille||"")?"Note fonds (12 mois face à l'indice)":"Note Quality Value (Higgons)"} : ${k}/5" aria-label="Note Higgons ${k} sur 5">${"★".repeat(k)}<span class="off">${"★".repeat(5-k)}</span></span>`;
}
function crit(l){
  const c=l.higgons?.criteres; if(!Array.isArray(c)||!c.length) return "";
  // PER au-dessus de 12 (critère Higgons) : seul le chiffre passe en rouge
  const perHi=k=>{const t=esc(k);return /PER|PE /.test(k)?t.replace(/(^|[^\d,])(\d{1,3}(?:,\d+)?)(?![\d,e])/g,(m,a,v)=>parseFloat(v.replace(",","."))>12?`${a}<span class="perhi">${v}</span>`:m):t;};
  return `<div class="hq">${c.map(x=>`<span class="${x.ok?"y":"x"}">${x.ok?"✓":"✗"} ${perHi(x.k)}</span>`).join(" · ")}${l.higgons.commentaire?` — <i>${esc(l.higgons.commentaire)}</i>`:""}${l.higgons.date?` <span class="x">(${fdate(l.higgons.date)})</span>`:""}</div>`;
}
/* ---- médaille dividende : rendement = dividende annuel par action ÷ cours ---- */
const MEDALS=[[0.06,"or","Or"],[0.04,"argent","Argent"],[0.02,"bronze","Bronze"]]; // ≥ 6 % · ≥ 4 % · ≥ 2 %
/* ligne vendue (champ vendu) : gardée pour mémoire, quantité comptée à 0 partout (totaux, dividendes, plus-values, signaux) */
const Q=l=>l.vendu?0:n(l.qte);
const divYield=l=>{const d=n(l.dividende?.montant),c=n(l.cours);return d!=null&&c?d/c:null;};
const divYear=l=>{const d=n(l.dividende?.montant),q=Q(l);return d!=null&&q>0?d*q:0;};
function medal(l){
  const y=divYield(l); if(y==null) return "";
  const m=MEDALS.find(([t])=>y>=t); if(!m) return "";
  const d=l.dividende, an=divYear(l);
  const t=`Médaille ${m[2]} dividende : rendement ${pct(y).replace("+","")} (${eur(+d.montant)} par action et par an${d.estime?", estimé":""}${d.info?" · "+d.info:""})${an?` · ≈ ${eur(an,0)} par an sur ta ligne`:""}`;
  return `<span class="med m-${m[1]}" title="${esc(t)}" aria-label="${esc(t)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 2l3 7M16 2l-3 7" stroke-linecap="round"/><circle cx="12" cy="15" r="6.5" fill="currentColor" fill-opacity=".25"/><path d="M12 11.6l1 2.1 2.3.3-1.7 1.6.4 2.3-2-1.1-2 1.1.4-2.3-1.7-1.6 2.3-.3z" fill="currentColor" stroke="none"/></svg>${pct(y).replace("+","")}</span>`;
}
/* ---- lien vers le cours en direct (Boursorama par défaut, champ « lien » pour forcer une adresse) ---- */
const BNP_FONDS={"pee-multipar-actions":"https://epargne-retraite-entreprises.bnpparibas/fonds/multipar-actions-europe-bas-carbone/","pee-multimanagers":"https://epargne-retraite-entreprises.bnpparibas/fonds/multimanagers-actions-internationales-dws/","pee-multipar-bnp":"https://epargne-retraite-entreprises.bnpparibas/fonds/multipar-bnp-paribas-horizon-prudent/"};
function liveUrl(l){
  if(l.lien) return l.lien;
  if(BNP_FONDS[l.id]) return BNP_FONDS[l.id];
  if(l.source&&/^https:\/\//.test(l.source)) return l.source;
  const c=String(l.code||"").trim(); if(!c||c==="FCPE"||/\s/.test(c)) return null;
  return typeOf(l)==="Actions"?`https://www.boursorama.com/cours/1rP${encodeURIComponent(c)}/`:`https://www.boursorama.com/bourse/trackers/cours/1rT${encodeURIComponent(c)}/`;
}
function live(l){
  const u=liveUrl(l); if(!u) return "";
  let host=""; try{host=new URL(u).hostname.replace(/^www\./,"");}catch{return "";}
  const t=BNP_FONDS[l.id]&&!l.lien?"VL officielle sur le site BNP Paribas":`Cours en direct sur ${host}`;
  return `<a class="live" href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${esc(t)}" aria-label="${esc(t)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>`;
}
/* ---- données ayant servi à l'analyse (champ « analyse », écrit par Claude depuis le robot de cours) ---- */
function anaBlock(l){
  const a=l.analyse, h=l.higgons;
  if(!a&&!h?.calcul&&!l.achat?.base) return "";
  const num=(v,d=2)=>v==null||isNaN(v)?"—":Number(v).toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d});
  const pc=v=>v==null||isNaN(v)?"—":(v*100).toLocaleString("fr-FR",{maximumFractionDigits:1})+" %";
  let t="";
  const yrs=a?.annees?Object.keys(a.annees).sort():[], est=a?.estimations?Object.keys(a.estimations).sort():[];
  if(yrs.length||est.length){
    const cols=[...yrs,...est];
    const row=(lab,f,d)=>`<tr><td>${lab}</td>${cols.map(y=>{const isE=est.includes(y);const v=isE?(f==="bpa"?a.estimations[y]:null):a.annees[y]?.[f];return `<td${isE?' class="e"':""}>${num(v,d)}</td>`}).join("")}</tr>`;
    t=`<div class="tw"><table><thead><tr><th></th>${cols.map(y=>`<th${est.includes(y)?' class="e"':""}>${esc(y)}</th>`).join("")}</tr></thead><tbody>
      ${row("BPA (€)","bpa",2)}${row("Résultat net (M€)","rn",0)}${row("Fonds propres (M€)","fp",0)}${row("Dette nette (M€)","dn",0)}</tbody></table></div>`;
  }
  const r=a?.ratios||{}, p=[];
  if(r.roe!=null||r.detteFP!=null||r.per!=null) p.push(`<span class="k">ROE</span> ${pc(r.roe)} · <span class="k">dette nette / FP</span> ${pc(r.detteFP)} · <span class="k">PER ${esc(r.perBase||"")}</span> ${num(r.per,1)}`);
  if(a?.plusHaut12) p.push(`<span class="k">12 mois :</span> plus haut ${num(a.plusHaut12.v)} € (${fdate(a.plusHaut12.d)}) · plus bas ${num(a.plusBas12?.v)} € (${fdate(a.plusBas12?.d)})`);
  if(a?.consensus?.mediane) p.push(`<span class="k">Analystes :</span> objectif médian ${num(a.consensus.mediane)} € (${a.consensus.nb||"?"} analystes)`);
  if(h?.calcul) p.push(`<span class="k">Seuil Higgons :</span> ${esc(h.calcul)}`);

    `<button class="chip" type="button" id="fbuy" aria-pressed="${filterMine==="non"}" title="Lignes que tu ne possèdes pas" style="margin-left:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M2 3h3l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L21 7H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg> À acheter <span class="num">${ev.filter(x=>(!filterType||typeOf(x.l)===filterType)&&(!filterEnv||x.l.env===filterEnv)&&!mine(x)).length}</span></button>`+
    `<button class="chip" type="button" id="fmine" aria-pressed="${filterMine==="oui"}" title="Lignes détenues (achetées)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M2 3h3l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L21 7H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/><path d="M8 11V5h4v6M12 11V7h4v4M16 11V8h3" fill="currentColor" fill-opacity=".35"/></svg> Acheté <span class="num">${ev.filter(x=>(!filterType||typeOf(x.l)===filterType)&&(!filterEnv||x.l.env===filterEnv)&&mine(x)).length}</span></button>`+
    [5,4].map(k=>`<button class="chip" type="button" data-star="${k}" aria-pressed="${filterStar===k}" title="Note Higgons ${k}/5"${k===5?' style="margin-left:8px"':''}><span style="color:#b8860b">${"★".repeat(k)}</span> ${k}★ <span class="num">${base.filter(l=>starN(l)===k).length}</span></button>`).join("");
  const T=lines.reduce((s,l)=>s+val(l),0), L=lines.reduce((s,l)=>s+lat(l),0);
  $("#total").textContent=T?eur(T+(Object.keys(especes||{}).filter(k=>ENVS.includes(k)).reduce((s,k)=>s+(n(especes[k])||0),0)),0):"—";
  // synthèse par enveloppe : valeur (toutes les lignes avec quantité) et plus-value
  // PEE : sur 12 mois glissants (cours actuel − cours d'il y a un an, champ « an ») ; à défaut de cours à 1 an, depuis le PRU.
  // Autres enveloppes : plus-value latente depuis le PRU.
  const base12=l=>{const a=n(l.an?.cours);return l.env==="PEE"&&a>0?a:null;};
  const agg=ls=>{let v=0,pv=0,cost=0,sans=0,pru=0;ls.forEach(l=>{const q=Q(l),c=n(l.cours),a=base12(l),p=n(l.pru);if(!(q>0)||c==null)return;v+=q*c;const b=a??p;if(b!=null){pv+=q*(c-b);cost+=q*b;if(a==null&&l.env==="PEE")pru++;}else sans++;});return {v,pv,cost,sans,pru};};
  const nc=(e,a)=>[e==="PEE"?"sur 12 mois glissants":"",a.pru?`${a.pru} ligne${a.pru>1?"s":""} depuis le PRU (pas encore de cours à 1 an)`:"",a.sans?`${a.sans} ligne${a.sans>1?"s":""} sans PRU`:""].filter(Boolean).join(" · ");
  const rowS=(lab,a,cls="",note="")=>`<tr class="${cls}"><td>${lab}</td><td>${eur(a.v,0)}</td><td class="${a.cost?(a.pv>=0?"pos":"neg"):""}">${a.cost?`${a.pv>=0?"+":"−"}${eur(Math.abs(a.pv),0)}`:"—"}</td><td class="${a.cost?(a.pv>=0?"pos":"neg"):""}">${a.cost?pct(a.pv/a.cost):"—"}</td><td class="nc">${note}</td></tr>`;
  const envRows=used.map(e=>({e,a:agg(lines.filter(l=>l.env===e))})).filter(x=>x.a.v>0);
  const cash=e=>n(especes?.[e])||0, cashT=Object.keys(especes||{}).filter(k=>ENVS.includes(k)).reduce((s,k)=>s+cash(k),0);
  const rowC=e=>{const c=cash(e);if(!c)return "";const tot=c+(envRows.find(x=>x.e===e)?.a.v||0);return `<tr class="cash"><td>${esc(e)} · espèces</td><td>${eur(c,0)}</td><td>—</td><td>${(c/tot*100).toLocaleString("fr-FR",{maximumFractionDigits:1})} %</td><td class="nc">part du ${esc(e)} (titres + espèces ${eur(tot,0)})${especes.date?` · saisi le ${fdate(especes.date)}`:""}</td></tr>`;};
  const rowV=e=>{const vs=n(especes?.versements?.[e]);if(!vs)return "";const tot=cash(e)+(envRows.find(x=>x.e===e)?.a.v||0),g=tot-vs;return `<tr class="cash"><td>${esc(e)} · versé</td><td>${eur(vs,0)}</td><td class="${g>=0?"pos":"neg"}">${g>=0?"+":"−"}${eur(Math.abs(g),0)}</td><td class="${g>=0?"pos":"neg"}">${pct(g/vs)}</td><td class="nc">performance réelle : titres + espèces (${eur(tot,0)}) − versements</td></tr>`;};
  const rowH=e=>{if(e!=="PEA")return "";const ls=lines.filter(l=>l.env===e&&Q(l)>0&&n(l.cours)),tot=ls.reduce((s,l)=>s+Q(l)*l.cours,0)+cash(e),ct=ls.filter(l=>l.horizon?.type==="court").reduce((s,l)=>s+Q(l)*l.cours,0);if(!tot||!ct)return "";const p=ct/tot;return `<tr class="cash"><td>${esc(e)} · court terme</td><td>${eur(ct,0)}</td><td>—</td><td class="${p>0.2?"neg":""}">${(p*100).toLocaleString("fr-FR",{maximumFractionDigits:1})} %</td><td class="nc">part de la poche court terme dans le PEA (plafond 20 %)${p>0.2?" — <b>au-dessus du plafond</b>":""}</td></tr>`;};
  const totA=(()=>{const a=agg(lines);return {...a,v:a.v+cashT};})();
  $("#synth").innerHTML=envRows.length?`<table><thead><tr><th>Enveloppe</th><th>Valeur</th><th title="PEE : sur 12 mois glissants · autres enveloppes : depuis le PRU">Plus-value</th><th>%</th><th></th></tr></thead><tbody>${envRows.map(x=>rowS(esc(x.e),x.a,"",nc(x.e,x.a))+rowC(x.e)+rowV(x.e)+rowH(x.e)).join("")}${rowS("Total",totA,"tot",(cashT?`espèces incluses (${eur(cashT,0)}) · `:"")+(envRows.some(x=>x.e==="PEE")?"PEE sur 12 mois, le reste depuis le PRU":""))}</tbody></table>`:"";
  const D=lines.filter(l=>!filterEnv||l.env===filterEnv).reduce((s,l)=>s+divYear(l),0);
  $("#totalpl").innerHTML=(L?`<span class="${L>=0?"pos":"neg"}">${L>=0?"+":"−"}${eur(Math.abs(L),0)} latents depuis l'achat</span>`:"")+(D?`${L?" · ":""}<span title="Dividendes annuels estimés sur les lignes détenues">≈ ${eur(D,0)}/an de dividendes</span>`:"");
  // PER moyen du portefeuille (actions détenues, pondéré par la valeur ; moyenne harmonique = valeur totale ÷ bénéfices détenus)
  {const PER_OBJ=10;let V=0,E=0,k=0,x=0;lines.forEach(l=>{const q=Q(l),c=n(l.cours);if(!(q>0)||c==null||l.type==="ETF"||l.env==="PEE")return;const a=l.analyse||{},r=a.ratios||{},b=n(a.estimations?.[r.perBase]);let per=(a.devise||"EUR")==="EUR"&&b?c/b:n(r.per);if(per==null&&!b)return;if(!(per>0)){x++;return;}V+=q*c;E+=q*c/per;k++;});
   const P=E?V/E:null;$("#perm").innerHTML=P?`<span class="${P<PER_OBJ?"pos":"neg"}" title="PER moyen pondéré des ${k} actions détenues hors PEE (cours actuel ÷ BPA estimé de l'année de référence)${x?` · ${x} exclue${x>1?"s":""} (bénéfice négatif ou inconnu)`:""}">PER moyen ${P.toFixed(1).replace(".",",")}</span> · objectif &lt; ${PER_OBJ}`:"";}
  // lignes
  let shown=ev.filter(inScope).filter(({l,e})=>!filterSig||(filterSig==="drop"?isDrop(l):filterSig==="hg"?isHg(l):e.rules.some(r=>r.k===filterSig)));
  // tri dans un même statut : d'abord les non achetées, meilleure affaire en tête (cours le plus bas vs seuil d'achat) ;
  // puis les déjà achetées (PRU ou quantité), les plus proches de leur objectif de vente en tête
  const held=l=>n(l.pru)!=null||n(l.qte)>0;
  const key=({l})=>{const c=n(l.cours);if(c==null)return Infinity;
    if(held(l)){const o=n(l.vente?.objectifDerive)??n(l.vente?.objectif);return o==null?Infinity:(o-c)/o;}
    const p=n(l.achat?.prixDerive)??n(l.achat?.prix);return p==null?Infinity:(c-p)/p;};
  const cmp=(x,y)=>x===y?0:x<y?-1:1;
  // ordre d'affichage : à vendre · à acheter · bientôt à vendre · bientôt à acheter · délai dépassé · en veille · à configurer
  const grp=e=>{const ks=e.rules.map(r=>r.k);return ks.includes("sell")?0:ks.includes("buy")?1:ks.includes("soonsell")?2:ks.includes("soonbuy")?3:ks.includes("expired")?4:e.rank===5?6:5;};
  if(filterBx&&!filterDiv) shown.sort((A,B)=>bxN(B.l)-bxN(A.l)||String(A.l.nom).localeCompare(B.l.nom,"fr")); // filtre baisses : niveau le plus élevé en tête
  if(filterDiv) shown.sort((A,B)=>(divYield(B.l)??0)-(divYield(A.l)??0)); // filtre dividendes : meilleur rendement en tête
  const gain=l=>{const c=n(l.cours),p=n(l.pru);return Q(l)>0&&p&&c!=null&&c>p?c/p-1:null;}; // lignes détenues en plus-value : en tête, meilleur gain d'abord
  if(!filterDiv&&!filterBx) shown.sort((A,B)=>{const a=gain(A.l),b=gain(B.l);if(a!=null||b!=null)return (b!=null)-(a!=null)||(b??0)-(a??0);return grp(A.e)-grp(B.e)||(held(A.l)-held(B.l))||cmp(key(A),key(B))||String(A.l.nom).localeCompare(B.l.nom,"fr");});
  if(!lines.length){$("#list").innerHTML=`<div class="empty">Aucune ligne suivie pour l'instant.<br>Ajoute une valeur, un ETF ou un fonds avec ton seuil d'achat ou de revente et une date limite.</div>`;return;}
  if(!shown.length){$("#list").innerHTML=`<div class="empty">Rien dans ce filtre.</div>`;return;}
  $("#list").innerHTML=shown.map(({l,e})=>{
    const c=n(l.cours), stale=l.coursDate&&days(l.coursDate,TODAY)>STALE_DAYS;
    const pl=(c!=null&&n(l.pru))?(c-l.pru)/l.pru:null;
    const drop=isDrop(l);
    return `<button class="row" type="button" data-id="${esc(l.id)}" style="--stripe:${drop?"var(--drop)":e.rank===0?(e.rules.some(r=>r.k==="sell")?"var(--sell)":"var(--buy)"):stripe[e.rank]}"${drop?' title="Cours sous le seuil violet"':""}>
      <div style="min-width:0"><div class="name">${esc(l.nom)} <span class="env">${esc(l.env)}</span>${l.peaPme?.eligible&&l.env!=="PEA-PME"?`<span class="env" title="Éligible au PEA-PME (${esc(l.peaPme.liste||"")})">PME</span>`:""}${stars(l)}${medal(l)}${conc(l)}${spk(l)}${bx(l)}${dcr(l)}${drv(l)}</div>
        <div class="code">${esc(l.code||"")}${n(l.qte)?` · ${l.qte.toLocaleString("fr-FR")} parts`:""}${n(l.pru)?` · PRU ${eur(l.pru)}${n(l.qte)>0?' <span class="okin" title="Ligne achetée">👍</span>':""}`:""}${l.vendu?` <span class="sold" title="Vendue${l.vendu.date?" le "+fdate(l.vendu.date):""} : gardée pour mémoire, hors totaux, dividendes et plus-values">$</span>`:""}</div></div>
      <div class="price"><div class="c num">${eur(c)}${live(l)}</div>
        <div class="d ${stale?"stale":""}">${pl!=null?`<span class="pl ${pl>=0?"pos":"neg"}">${pct(pl)}</span> · `:""}${l.coursDate?(stale?"cours du ":"")+fdate(l.coursDate)+(l.coursHeure?" "+esc(l.coursHeure):""):""}${ageH(l)>OLD_HOURS?' <span class="old" title="Cours de plus de 24 h">différé</span>':""}</div>${vlInfo(l)}${g12(l)}</div>
      ${(()=>{const h=crit(l)+memo(l)+(l.concentration?.txt&&l.concentration.niveau!=="faible"?`<div class="hq">Concentration ${esc(l.concentration.type||"client")} : ${esc(l.concentration.txt)}</div>`:"");return h?`<div class="hqw">${h}</div>`:"";})()}
      <div class="rules">${e.rules.map(r=>`<div class="rule"><span class="pill ${r.cls}">${r.tag}</span><span class="txt">${r.txt}</span></div>`).join("")}${renfTxt(l)}</div>
      ${bar(l)}
    </button>`;}).join("");
  requestAnimationFrame(fixBars);
}

/* ---- feuille d'édition ---- */
function openSheet(l){
  editing=l?{...l,achat:{...(l.achat||{})},vente:{...(l.vente||{})}}:{env:filterEnv||"PEA",achat:{},vente:{},coursDate:TODAY};
  const g=(o,k)=>o?.[k]??"";
  $("#sheetHost").innerHTML=`<div class="scrim" id="scrim"><form class="sheet" id="f" novalidate>
    <h2>${l?"Modifier la ligne":"Nouvelle ligne"}</h2>
    <fieldset><legend>Support</legend>
      <label>Enveloppe<select id="f-env">${ENVS.map(e=>`<option ${e===editing.env?"selected":""}>${e}</option>`).join("")}</select></label>
      <label>Code / ISIN<input id="f-code" value="${esc(g(editing,"code"))}" placeholder="NEX · FR0000044448"></label>
      <label class="full">Nom<input id="f-nom" value="${esc(g(editing,"nom"))}" placeholder="Nexans, ETF MSCI World, fonds euros…" required></label>
      <label>Quantité<input id="f-qte" type="number" step="any" inputmode="decimal" value="${g(editing,"qte")}"></label>
      <label>PRU (€)<input id="f-pru" type="number" step="any" inputmode="decimal" value="${g(editing,"pru")}"></label>
      <label>Cours actuel (€)<input id="f-cours" type="number" step="any" inputmode="decimal" value="${g(editing,"cours")}"></label>
      <label>Date du cours<input id="f-cdate" type="date" value="${g(editing,"coursDate")}"></label>
      <label>Horizon de revente<select id="f-hz"><option value="">—</option><option value="long" ${editing.horizon?.type==="long"?"selected":""}>Long terme (1/3 à la cible)</option><option value="court" ${editing.horizon?.type==="court"?"selected":""}>Court terme (½ à +20 %, reste à +30 %, après 6 mois tout dès +3 %)</option></select></label>
      <label class="full" style="flex-direction:row;align-items:center;gap:8px"><input id="f-vendu" type="checkbox" style="width:auto" ${editing.vendu?"checked":""}> Vendue : garder la ligne pour mémoire, hors totaux, dividendes et plus-values</label>
    </fieldset>
    <fieldset><legend>Seuil d'achat</legend>
      <label>Acheter si cours ≤ (€)<input id="f-ap" type="number" step="any" inputmode="decimal" value="${g(editing.achat,"prix")}"></label>
      <label>Avant le<input id="f-ad" type="date" value="${g(editing.achat,"avant")}"></label>
    </fieldset>
    <fieldset><legend>Seuil de revente</legend>
      <label>Objectif : vendre si ≥ (€)<input id="f-vo" type="number" step="any" inputmode="decimal" value="${g(editing.vente,"objectif")}"></label>
      <label>Stop : vendre si ≤ (€)<input id="f-vs" type="number" step="any" inputmode="decimal" value="${g(editing.vente,"stop")}"></label>
      <label class="full">Objectif à atteindre avant le<input id="f-vd" type="date" value="${g(editing.vente,"avant")}"></label>
      <p class="hint">Passé la date, la ligne passe en « Délai dépassé » pour que tu décides : vendre, prolonger ou changer d'objectif.</p>
    </fieldset>
    <label>Prix de vente (si tu viens de vendre tout ou partie)<input id="f-pv" type="number" step="any" inputmode="decimal" placeholder="ex. 88,6"></label>
    <label>Dividende annuel (€ par action)<input id="f-div" type="number" step="any" inputmode="decimal" value="${g(editing.dividende,"montant")}"></label>
    <p class="hint">Médaille : bronze ≥ 2 %, argent ≥ 4 %, or ≥ 6 % de rendement au cours actuel.</p>
    ${l?anaBlock(l):""}
    <label>Note<textarea id="f-note" rows="2">${esc(g(editing,"note"))}</textarea></label>
    <label>Note Quality Value (Higgons)<select id="f-hq"><option value="">—</option>${[0,1,2,3,4,5].map(k=>`<option value="${k}" ${n(editing.higgons?.note)===k?"selected":""}>${k?"★".repeat(k):"0★"} (${k}/5)</option>`).join("")}</select></label>
    <div class="err" id="f-err" hidden></div>
    <div class="actions">
      <div>${l?`<button class="btn danger" type="button" id="f-del">Supprimer</button>`:""}</div>
      <div style="display:flex;gap:8px"><button class="btn" type="button" id="f-cancel">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div>
    </div></form></div>`;
  const close=()=>{$("#sheetHost").innerHTML="";editing=null;};
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")close();});
  $("#f-cancel").onclick=close;
  const del=$("#f-del");
  if(del) del.onclick=async()=>{
    if(del.dataset.armed!=="1"){del.dataset.armed="1";del.textContent="Confirmer la suppression";return;}
    await removeLine(l.id); close();
  };
  // une date de cours à jour quand on change le cours
  $("#f-cours").addEventListener("input",()=>{$("#f-cdate").value=TODAY;});
  $("#f").addEventListener("submit",async e=>{
    e.preventDefault();
    const v=id=>$(id).value.trim();
    const {id:_omit,...keep}=editing;
    const rec={...keep,env:v("#f-env"),code:v("#f-code"),nom:v("#f-nom"),qte:n(v("#f-qte")),pru:n(v("#f-pru")),cours:n(v("#f-cours")),coursDate:v("#f-cdate")||null,
      achat:{prix:n(v("#f-ap")),avant:v("#f-ad")||null},vente:{objectif:n(v("#f-vo")),stop:n(v("#f-vs")),avant:v("#f-vd")||null},note:v("#f-note"),maj:new Date().toISOString()};
    if($("#f-vendu").checked) rec.vendu=editing.vendu||{date:TODAY}; else delete rec.vendu;
    const hz=v("#f-hz"); if(!hz) delete rec.horizon; else if(hz!==editing.horizon?.type) rec.horizon={type:hz,date:TODAY,auto:false};
    // vente saisie : enregistrée (date, prix, quantité) et créditée sur les espèces de l'enveloppe
    const pv=n(v("#f-pv")), q0=editing.vendu?0:(n(editing.qte)||0), q1=rec.vendu?0:(n(rec.qte)||0);
    if(pv&&q1<q0){const qv=q0-q1;rec.ventes=[...(editing.ventes||[]),{date:TODAY,prix:pv,qte:qv,pru:n(editing.pru),type:q1>0?"tranche":"totale",source:"saisie page"}];rec._credit=Math.round(qv*pv*100)/100;}
    const dv=n(v("#f-div"));
    if(dv==null) delete rec.dividende;
    else if(dv!==n(editing.dividende?.montant)) rec.dividende={montant:dv,estime:false,date:TODAY,info:"saisi à la main"};
    const hq=n(v("#f-hq"));
    if(hq==null){} // pas de note choisie : on garde la note existante (avant, une note 0★ était effacée)
    else if(hq!==n(editing.higgons?.note)) rec.higgons={...(editing.higgons||{}),note:hq,manuel:true,date:TODAY};
    const err=$("#f-err");
    if(!rec.nom){err.textContent="Donne un nom à la ligne.";err.hidden=false;return;}
    if(rec.vente.objectif!=null&&rec.vente.stop!=null&&rec.vente.stop>=rec.vente.objectif){err.textContent="Le stop doit être inférieur à l'objectif de vente.";err.hidden=false;return;}
    const cr=rec._credit; delete rec._credit;
    try{await saveLine(l?.id,rec);
      // achat saisi (quantité × PRU en hausse) dans une enveloppe avec espèces suivies : on le prend sur les espèces
      const cost=x=>{const q=x&&!x.vendu?n(x.qte):null,p=x?n(x.pru):null;return q>0&&p>0?q*p:0;};
      if(cr&&n(especes?.[rec.env])!=null&&db){try{await db.collection("journal").doc("especes").update({[rec.env]:Math.round((n(especes[rec.env])+cr)*100)/100,date:TODAY});}catch{}}
      const dlt=Math.round((cost(rec)-(l?.env===rec.env?cost(editing):0))*100)/100, cs=n(especes?.[rec.env]);
      if(dlt>0.004&&cs!=null&&db){try{await db.collection("journal").doc("especes").update({[rec.env]:Math.round((cs-dlt)*100)/100,date:TODAY});}catch{}}
      close();}catch(x){err.textContent="Enregistrement impossible : "+(x?.message||x);err.hidden=false;}
  });
  setTimeout(()=>$(l?"#f-cours":"#f-nom").focus(),30);
}

/* ---- stockage ---- */
const LS="vigie-patrimoine-local";
const lsLoad=()=>{try{return JSON.parse(localStorage.getItem(LS)||"[]")}catch{return []}};
const lsSave=()=>{try{localStorage.setItem(LS,JSON.stringify(lines))}catch{}};
async function saveLine(id,rec){
  if(coll){const ref=id?coll.doc(id):coll.doc();await ref.set(rec);return;}
  if(id){lines=lines.map(x=>x.id===id?{...rec,id}:x);}else{lines.push({...rec,id:"l"+Date.now()});}
  lsSave();render();
}
async function removeLine(id){
  if(coll){await coll.doc(id).delete();return;}
  lines=lines.filter(x=>x.id!==id);lsSave();render();
}

/* ---- interactions ---- */
document.addEventListener("click",e=>{
  const s=e.target.closest(".sig"); if(s){filterSig=filterSig===s.dataset.k?null:s.dataset.k;render();return;}
  if(e.target.closest("#reset")){filterType=null;filterEnv=null;filterSig=null;filterDiv=null;filterBx=false;filterMine=false;filterStar=null;render();return;}
  if(e.target.closest("#fbx")){filterBx=!filterBx;render();return;}
  if(e.target.closest("#fbuy")){filterMine=filterMine==="non"?false:"non";render();return;}
  if(e.target.closest("#fmine")){filterMine=filterMine==="oui"?false:"oui";render();return;}
  const st=e.target.closest("[data-star]"); if(st){const k=+st.dataset.star;filterStar=filterStar===k?null:k;render();return;}
  const dv=e.target.closest("[data-div]"); if(dv){filterDiv=filterDiv===dv.dataset.div?null:dv.dataset.div;render();return;}
  const c=e.target.closest(".chip"); if(c){if("type" in c.dataset)filterType=c.dataset.type||null;else filterEnv=c.dataset.env||null;render();return;}
  if(e.target.closest("a.live")) return; // le lien s'ouvre sans ouvrir la fiche
  const r=e.target.closest(".row"); if(r){openSheet(lines.find(x=>x.id===r.dataset.id));return;}
});

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&editing){$("#sheetHost").innerHTML="";editing=null;}});

render();
setInterval(render,5*60*1000); // le badge « différé » apparaît sans recharger la page
// page restée ouverte en arrière-plan (téléphone) : au retour, rechargement complet pour ne jamais afficher de données ou de liens périmés
let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){hiddenAt=Date.now();return;}
  // au retour après plus d'une minute : on se réabonne à la base (plus de rechargement complet, qui laissait la page vide)
  if(hiddenAt&&Date.now()-hiddenAt>60*1000&&!editing&&typeof window.subscribe==="function") window.subscribe();
  render();
});
window.addEventListener("pageshow",e=>{if(e.persisted&&typeof window.subscribe==="function") window.subscribe();});
(async()=>{
  try{db=await window.claude?.use?.("db");}catch{db=null}
  if(!db){
    lines=lsLoad();
    const b=$("#banner");b.textContent="Synchronisation indisponible ici : les lignes sont gardées seulement dans ce navigateur.";b.hidden=false;
    render();return;
  }
  coll=db.collection("lignes");
  let unsubs=[], retry=null;
  window.subscribe=()=>{
    unsubs.forEach(u=>{try{u&&u();}catch{}}); unsubs=[]; clearTimeout(retry);
    try{unsubs.push(db.collection("journal").doc("jour").onSnapshot(d=>{jour=d.exists?d.data():null;renderJour();},()=>{}));}catch{}
    try{unsubs.push(db.collection("journal").doc("readme").onSnapshot(d=>{const r=d.exists?d.data():null,box=$("#readme");if(!box)return;if(!r||!r.md){box.hidden=true;return;}box.hidden=false;$("#readmeDate").textContent=r.date?`mis à jour le ${fdate(r.date)}`:"";try{$("#readmeBody").innerHTML=window.marked?marked.parse(r.md):`<pre>${esc(r.md)}</pre>`;}catch{$("#readmeBody").innerHTML=`<pre>${esc(r.md)}</pre>`;}},()=>{}));}catch{}
    try{unsubs.push(db.collection("journal").doc("especes").onSnapshot(d=>{especes=d.exists?d.data():null;render();},()=>{}));}catch{}
    try{unsubs.push(db.collection("journal").doc("speculation").onSnapshot(d=>{spec=d.exists?d.data():null;renderSpec();render();},()=>{}));}catch{}
    try{unsubs.push(coll.onSnapshot(snap=>{lines=snap.docs.map(d=>({...d.data(),id:d.id}));$("#banner").hidden=true;render();markProtected();},
      e=>{const b=$("#banner");b.textContent="Connexion à la base perdue ("+(e&&e.code||"?")+"), nouvelle tentative…";b.hidden=false;retry=setTimeout(window.subscribe,3000);}));}catch{retry=setTimeout(window.subscribe,3000);}
    // garde-fou : si rien n'est arrivé au bout de 6 s, on relance l'abonnement
    setTimeout(()=>{if(!lines.length) window.subscribe();},6000);
  };
  window.subscribe();
})();
</script>
